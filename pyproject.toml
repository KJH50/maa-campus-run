[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maa-campus-run"
version = "0.2.0"
description = "MaaCampusRun · 校园跑值守（MaaFramework 版）"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0" }
dependencies = [
    "MaaFw==5.15.0",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["maa_campus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
