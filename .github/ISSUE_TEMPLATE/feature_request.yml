name: 功能请求
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 问题
      description: 描述当前遇到的限制或希望改进的流程
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望如何实现（可附伪代码或流程说明）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 文档 / 示例
        - 配置 / 参数
        - 流程 / 点击逻辑
        - OCR / 距离配速解析
        - 脚本 / 一键入口
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 该建议不涉及绕过学校/平台安全机制或违反第三方条款
          required: true
        - label: 我理解本项目为非商业许可项目（PolyForm Noncommercial 1.0.0）
          required: true
